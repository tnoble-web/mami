<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FRIDGE · report</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 58'><rect x='3' y='2' width='36' height='50' rx='7' fill='%23e9eef6' stroke='%232a2f37' stroke-width='3'/><path d='M3 19h36' stroke='%232a2f37' stroke-width='3'/><rect x='31' y='24' width='3.4' height='10' rx='1.7' fill='%232a2f37'/><circle cx='16.5' cy='34' r='2.6' fill='%232a2f37'/><circle cx='25.5' cy='34' r='2.6' fill='%232a2f37'/><path d='M17 41.5q5 4 10 0' fill='none' stroke='%232a2f37' stroke-width='2.6' stroke-linecap='round'/></svg>">
<style>
  /* Chart tokens. One categorical hue (validated) plus a de-emphasis gray for
     weekends — the skill's "emphasis" form, not a second data series. */
  .viz-root {
    --series-1: #2a78d6;
    --deemph: #8a8f99;
    --grid: #e6e8ec;
    --viz-surface: #ffffff;
    --viz-text: #16181d;
    --viz-text-2: #61656e;
  }

  .chart { width: 100%; overflow: visible; display: block; }
  .chart .grid-line { stroke: var(--grid); stroke-width: 1; }
  .chart .axis-text { fill: var(--viz-text-2); font-size: 10px; font-weight: 600; }
  .chart .bar { fill: var(--series-1); }
  .chart .bar.is-weekend { fill: var(--deemph); }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover + .bar, .chart .hit:focus-visible + .bar { opacity: .78; }
  .chart .value-label { fill: var(--viz-text); font-size: 10px; font-weight: 700; }

  .spark { display: block; }
  .spark .spark-bar { fill: var(--series-1); }
  .spark .spark-bar.is-weekend { fill: var(--deemph); }

  .chart-legend {
    display: flex; gap: 14px; align-items: center;
    font-size: .76rem; color: var(--viz-text-2); font-weight: 600;
    margin: 10px 0 0;
  }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swatch.weekday { background: var(--series-1); }
  .swatch.weekend { background: var(--deemph); }

  .viz-tooltip {
    position: fixed; z-index: 30; pointer-events: none;
    background: var(--viz-text); color: var(--viz-surface);
    font-size: .78rem; font-weight: 600; line-height: 1.35;
    padding: 7px 10px; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
    opacity: 0; transition: opacity .1s ease;
    max-width: 220px;
  }
  .viz-tooltip.visible { opacity: 1; }

  details.numbers { margin-top: 12px; }
  details.numbers summary {
    cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 650;
  }
  details.numbers table { min-width: 0; margin-top: 10px; }
</style>
</head>
<body class="viz-root">

<header class="topbar">
  <div class="topbar-title"><span class="logo" id="logo-mascot"></span><span>FRIDGE report</span></div>
  <a class="who-chip" href="/">Check in</a>
</header>

<main>
  <div class="dash-head">
    <h1>How fast the fridge empties</h1>
    <div class="dash-meta" id="meta"></div>
  </div>

  <div class="controls">
    <label for="window-select">Based on the last</label>
    <select id="window-select">
      <option value="7">7 days</option>
      <option value="14" selected>14 days</option>
      <option value="30">30 days</option>
    </select>
    <label for="cover-select">Buy enough for</label>
    <select id="cover-select">
      <option value="5">1 week</option>
      <option value="10" selected>2 weeks</option>
      <option value="20">4 weeks</option>
    </select>
    <label for="limit-select">Daily limit per person</label>
    <select id="limit-select">
      <option value="1">1 drink</option>
      <option value="2">2 drinks</option>
      <option value="3">3 drinks</option>
      <option value="4">4 drinks</option>
      <option value="6">6 drinks</option>
      <option value="">no limit</option>
    </select>
  </div>

  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2>Buy this</h2>
    <p class="card-sub" id="buy-sub"></p>
    <div id="buy-list"></div>
  </section>

  <section class="card">
    <h2>Drinks taken per day</h2>
    <p class="card-sub" id="daily-sub"></p>
    <div id="daily-chart"></div>
    <p class="chart-legend">
      <span><i class="swatch weekday"></i>Weekday</span>
      <span><i class="swatch weekend"></i>Weekend</span>
    </p>
    <details class="numbers">
      <summary>Show the numbers</summary>
      <div class="table-scroll" id="daily-table"></div>
    </details>
  </section>

  <section class="card">
    <h2>When the fridge gets raided</h2>
    <p class="card-sub" id="hourly-sub"></p>
    <div id="hourly-chart"></div>
    <details class="numbers">
      <summary>Show the numbers</summary>
      <div class="table-scroll" id="hourly-table"></div>
    </details>
  </section>

  <section class="card">
    <h2>Stock and burn rate</h2>
    <p class="card-sub" id="stock-sub"></p>
    <div class="table-scroll" id="stock-table"></div>
  </section>

  <section class="card">
    <h2>Who's logging</h2>
    <p class="card-sub" id="people-sub"></p>
    <div class="table-scroll" id="people-table"></div>
  </section>

  <p class="footnote" id="footnote"></p>
</main>

<div class="viz-tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>

<dialog id="edit-sheet" class="sheet">
  <form id="edit-form">
    <h2 id="edit-title">Adjust drink</h2>
    <label class="field">
      <span>Name</span>
      <input id="edit-name" type="text" maxlength="40" required>
    </label>
    <label class="field">
      <span>In the fridge right now</span>
      <input id="edit-stock" type="number" inputmode="numeric" min="0" max="100000" step="1" required>
    </label>
    <label class="field">
      <span>Full shelf (target stock)</span>
      <input id="edit-par" type="number" inputmode="numeric" min="0" max="100000" step="1" required>
    </label>
    <label class="field">
      <span>Units per case</span>
      <input id="edit-case" type="number" inputmode="numeric" min="1" max="1000" step="1" required>
    </label>
    <label class="field">
      <span>Extra cap on this drink alone <em>(blank for none)</em></span>
      <input id="edit-limit" type="number" inputmode="numeric" min="0" max="99" step="1">
      <small>
        Optional, and on top of the house limit above — use it for something like
        "one Monster a day, even within your two drinks". A nudge, never a block.
      </small>
    </label>
    <p id="edit-error" class="error" role="alert" hidden></p>
    <div class="sheet-actions">
      <button type="button" class="btn btn-quiet" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<script type="module" src="/dashboard.js"></script>
</body>
</html>
