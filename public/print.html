<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FRIDGE · sticker to print</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-title"><span class="logo" aria-hidden="true">🧊</span><span>FRIDGE sticker</span></div>
  <a class="who-chip" href="/">Back</a>
</header>

<main>
  <div class="print-sheet">
    <p class="sheet-brand">FRIDGE</p>
    <h1>Grabbing a drink?</h1>
    <p class="lede">Scan this. Tap what you took. Two seconds.</p>
    <div class="qr-holder" id="qr-holder"></div>
    <p class="url" id="url-text"></p>
    <ol>
      <li>Scan the code — no app, no login.</li>
      <li>Tap your name once; your phone remembers it.</li>
      <li>Tap the drink you took.</li>
    </ol>
    <p style="margin-top:22px;color:#555;font-size:.9rem">
      This is how we know what to reorder. If it isn't logged, it doesn't get replaced.
    </p>
  </div>

  <div class="no-print">
    <p class="dash-meta" id="hint"></p>
    <button class="btn btn-primary" onclick="window.print()">Print this sheet</button>
  </div>
</main>

<script type="module">
const params = new URLSearchParams(location.search);
const config = await fetch('/api/config').then((r) => r.json()).catch(() => ({}));
// Prefer an explicitly configured base URL: a phone cannot resolve "localhost".
const target = params.get('url') || config.baseUrl || location.origin + '/';

document.getElementById('url-text').textContent = target.replace(/^https?:\/\//, '');
document.getElementById('qr-holder').innerHTML =
  await fetch(`/qr.svg?scale=8&url=${encodeURIComponent(target)}`).then((r) => r.text());

const hint = document.getElementById('hint');
if (/localhost|127\.0\.0\.1/.test(target)) {
  hint.textContent = 'Heads up: this code points at localhost, which phones cannot reach. '
    + 'Set FRIDGE_BASE_URL to the machine’s network address and reload.';
} else {
  hint.textContent = 'Tape it to the fridge door at eye level.';
}
</script>
</body>
</html>
