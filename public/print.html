<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FRIDGE · sticker to print</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 42 58'><rect x='3' y='2' width='36' height='50' rx='7' fill='%23e9eef6' stroke='%232a2f37' stroke-width='3'/><path d='M3 19h36' stroke='%232a2f37' stroke-width='3'/><rect x='31' y='24' width='3.4' height='10' rx='1.7' fill='%232a2f37'/><circle cx='16.5' cy='34' r='2.6' fill='%232a2f37'/><circle cx='25.5' cy='34' r='2.6' fill='%232a2f37'/><path d='M17 41.5q5 4 10 0' fill='none' stroke='%232a2f37' stroke-width='2.6' stroke-linecap='round'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar-title"><span class="logo" id="logo-mascot"></span><span>FRIDGE sticker</span></div>
  <a class="who-chip" href="/">Back</a>
</header>

<main>
  <div class="print-sheet">
    <div class="sheet-mascot" id="sheet-mascot"></div>
    <p class="sheet-brand">FRIDGE</p>
    <h1>Grabbing a drink?</h1>
    <p class="lede">Scan this. Tap what you took. Two seconds.</p>
    <div class="sheet-drinks" id="sheet-drinks"></div>
    <div class="qr-holder" id="qr-holder"></div>
    <p class="url" id="url-text"></p>
    <ol>
      <li>Scan the code — no app, no login.</li>
      <li>Tap your name once; your phone remembers it.</li>
      <li>Tap the drink you took.</li>
    </ol>
    <p style="margin-top:22px;color:#555;font-size:.9rem">
      This is how we know what to reorder. If it isn't logged, it doesn't get replaced.
    </p>
  </div>

  <div class="no-print">
    <p class="dash-meta" id="hint"></p>
    <button class="btn btn-primary" onclick="window.print()">Print this sheet</button>
  </div>
</main>

<script type="module">
import { fridgeMascot, drinkRow } from './mascot.js';

document.getElementById('logo-mascot').innerHTML = fridgeMascot('happy', 34);
document.getElementById('sheet-mascot').innerHTML = fridgeMascot('happy', 104);
document.getElementById('sheet-drinks').innerHTML = drinkRow(38);

const params = new URLSearchParams(location.search);
const config = await fetch('/api/config').then((r) => r.json()).catch(() => ({}));
// Prefer an explicitly configured base URL: a phone cannot resolve "localhost".
const target = params.get('url') || config.baseUrl || location.origin + '/';

document.getElementById('url-text').textContent = target.replace(/^https?:\/\//, '');
document.getElementById('qr-holder').innerHTML =
  await fetch(`/qr.svg?scale=8&url=${encodeURIComponent(target)}`).then((r) => r.text());

const hint = document.getElementById('hint');
if (/localhost|127\.0\.0\.1/.test(target)) {
  hint.textContent = 'Heads up: this code points at localhost, which phones cannot reach. '
    + 'Set FRIDGE_BASE_URL to the machine’s network address and reload.';
} else {
  hint.textContent = 'Tape it to the fridge door at eye level.';
}
</script>
</body>
</html>
